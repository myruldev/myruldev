name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # Jalan otomatis tiap 12 jam
  workflow_dispatch:           # Bisa dijalankan manual dari tab Actions
  push:
    branches:
      - main                   # Jalan saat ada push ke branch main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake (light + dark mode)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=10B981

      - name: Push SVG ke branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
